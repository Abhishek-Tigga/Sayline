name: Sayline
options:
  bundleIdPrefix: com.abhishektigga
  deploymentTarget:
    macOS: "14.0"
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 0.9.0
targets:
  Sayline:
    type: application
    platform: macOS
    sources:
      - Sources/Sayline
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: Sources/Sayline/Info.plist
      properties:
        LSUIElement: true
        NSMicrophoneUsageDescription: "Sayline needs microphone access to transcribe your speech into text."
        # Full access rather than write-only: cancelling a reminder by name
        # has to read the list to find a match.
        NSRemindersFullAccessUsageDescription: "Sayline needs access to Reminders so you can create and cancel them by voice."
        NSRemindersUsageDescription: "Sayline needs access to Reminders so you can create and cancel them by voice."
        # macOS 14 has no read-only grant for events, so a read-only feature
        # must ask for full access. This string is what the system dialog
        # shows, and it is the only place that explanation reaches the person
        # deciding — so it says plainly what Sayline does and does not do.
        NSCalendarsFullAccessUsageDescription: "Sayline reads your calendar to find the next meeting and its join link. It never creates, edits or deletes events."
        NSCalendarsUsageDescription: "Sayline reads your calendar to find the next meeting and its join link. It never creates, edits or deletes events."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhishektigga.sayline
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
