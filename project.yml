name: Sayline
options:
  bundleIdPrefix: com.abhishektigga
  deploymentTarget:
    macOS: "14.0"
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 0.9.0
targets:
  Sayline:
    type: application
    platform: macOS
    sources:
      - Sources/Sayline
      # Bundled so the app does not depend on Inter or IBM Plex Mono being
      # installed — neither was, on any machine tested. Both are SIL Open
      # Font License 1.1, which permits redistribution in a commercial app;
      # each ships with its OFL.txt beside it as that licence requires.
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: Sources/Sayline/Info.plist
      properties:
        # Wired to the build settings below. Info.plist is GENERATED from
        # this block — editing the file directly is silently undone on the
        # next `xcodegen generate`, which is how these two came to be
        # hardcoded to 1.0/1 while MARKETING_VERSION and
        # CURRENT_PROJECT_VERSION sat unused. The version in the log line
        # is the quickest way to tell whether a build actually took.
        # Registers every font in Contents/Resources at launch. Without
        # this the .ttf ships but is never loaded, and Font.custom falls
        # back to the system face silently.
        ATSApplicationFontsPath: "."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSMicrophoneUsageDescription: "Sayline needs microphone access to transcribe your speech into text."
        # Asked on the first send to a named person, never at launch —
        # the permission table in DESIGN-whatsapp-share.md. Without this
        # key the first Contacts read terminates the app rather than
        # prompting, which is a crash disguised as a permission bug.
        NSContactsUsageDescription: "Sayline looks up the person you name when you share a page, so it can open the right WhatsApp chat. Contacts are read on your Mac and never sent anywhere."
        # Reading the front browser's current tab is an Apple Event.
        NSAppleEventsUsageDescription: "Sayline asks your browser for the page you are reading, so it can share that link when you ask."
        # Full access rather than write-only: cancelling a reminder by name
        # has to read the list to find a match.
        NSRemindersFullAccessUsageDescription: "Sayline needs access to Reminders so you can create and cancel them by voice."
        NSRemindersUsageDescription: "Sayline needs access to Reminders so you can create and cancel them by voice."
        # macOS 14 has no read-only grant for events, so a read-only feature
        # must ask for full access. This string is what the system dialog
        # shows, and it is the only place that explanation reaches the person
        # deciding — so it says plainly what Sayline does and does not do.
        NSCalendarsFullAccessUsageDescription: "Sayline reads your calendar to find the next meeting and its join link. It never creates, edits or deletes events."
        NSCalendarsUsageDescription: "Sayline reads your calendar to find the next meeting and its join link. It never creates, edits or deletes events."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhishektigga.sayline
        SWIFT_VERSION: "5.0"
        # Signed with a real identity rather than ad-hoc.
        #
        # macOS binds an Accessibility grant, a Microphone grant and a
        # Keychain item to the code signature that created them. Ad-hoc
        # signing mints a new signature on every single build, so every
        # rebuild looked like a brand-new app: the grants reset and the
        # stored API key became unreadable (OSStatus -25293). On
        # 2026-08-13 that happened roughly ten times in one session and
        # cost hours, including a keychain dialog that blocked the app for
        # twenty minutes.
        #
        # A stable team identity makes macOS recognise the app across
        # rebuilds. The certificate was already on this machine, unused.
        #
        # Apple Development expires in about a year and is for the
        # developer's own machines. Shipping to other people needs a
        # Developer ID certificate and the paid programme — a separate
        # step, recorded in BACKLOG.md.
        # Manual, not Automatic: automatic signing asks for a "Mac
        # Development" certificate, and the one on this machine is the
        # newer unified "Apple Development" type. Naming the identity
        # directly avoids Xcode hunting for a certificate that does not
        # exist.
        DEVELOPMENT_TEAM: U3LU8MZPUM
        # By SHA-1 fingerprint, not by name. Setting the name "Apple
        # Development" makes xcodebuild look for the legacy "Mac
        # Development" type and fail — "No signing certificate 'Mac
        # Development' found" — even though `codesign -s` with the same
        # certificate signs the app perfectly. The fingerprint skips the
        # name lookup entirely.
        #
        # The fingerprint rather than the certificate's full name because
        # the name embeds an email address and this repository is public.
        #
        # This identifies one certificate in one machine's keychain, so
        # another machine overrides it on the command line:
        #   xcodebuild ... CODE_SIGN_IDENTITY=<their fingerprint>
        # from `security find-identity -v -p codesigning`. Nothing here
        # needs to change for that; a wrong fingerprint fails the build
        # loudly rather than silently falling back to ad-hoc.
        #
        # Why it matters at all: ad-hoc signing produces the designated
        # requirement `cdhash H"..."` — the literal hash of the binary.
        # TCC (Accessibility, Microphone) and Keychain ACLs match on that
        # requirement, so every rebuild produced a new hash and reset every
        # grant, including the stored Groq key. Signed, the requirement is
        # `identifier + anchor apple generic + leaf CN`, which no longer
        # mentions the hash. Rebuilds stop costing permissions.
        CODE_SIGN_IDENTITY: 559E9A687986F4597566BDADF3CF0966CE3B03A6
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
